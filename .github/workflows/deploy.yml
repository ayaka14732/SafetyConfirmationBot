name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: dist
      run: |
        mkdir dist
        cp -r website/ dist/
        sed -i "s|@@NAME_JA@@|${{ vars.NAME_JA }}|g" dist/index.html
        sed -i "s|@@NAME_EN@@|${{ vars.NAME_EN }}|g" dist/index.html
        sed -i "s|@@TIME_JA@@|${{ vars.TIME_JA }}|g" dist/index.html
        sed -i "s|@@TIME_EN@@|${{ vars.TIME_EN }}|g" dist/index.html
        sed -i "s|@@LOCATION_JA@@|${{ vars.LOCATION_JA }}|g" dist/index.html
        sed -i "s|@@LOCATION_EN@@|${{ vars.LOCATION_EN }}|g" dist/index.html
        sed -i "s|@@WARNING_CLASS@@|${{ vars.WARNING_CLASS }}|g" dist/index.html
        sed -i "s|@@WARNING_DAYS@@|${{ vars.WARNING_DAYS }}|g" dist/index.html
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
